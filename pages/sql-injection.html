<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Records – MediCare Pro</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  
  <div class="app-layout">
    <div id="sidebarMount"></div>
    <main class="main">
      <div id="topnavMount"></div>
      <div class="page-content">

        <div class="page-header">
          <h1>📋 Patient Records</h1>
          <p>Search and retrieve patient information by ID.</p>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-header">
              <div class="card-icon card-icon-teal">🗃️</div>
              <h2>Patient Record Lookup</h2>
            </div>
            <div class="card-body">
              <p style="font-size:13px;color:var(--gray-700);margin-bottom:16px;">
                Enter a patient ID to retrieve their records from the database.
              </p>
              <div class="form-group">
                <label class="form-label">Patient ID</label>
                <input type="text" class="form-control mono" id="sqlInput" placeholder="e.g. 1" value="1">
              </div>
              <button class="btn btn-primary" onclick="doQuery()">Search Records</button>

              <div id="sqlResult" style="margin-top:16px;display:none;">
                <div class="divider"></div>
                <p style="font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:10px;">Results: <span id="resultCount" style="color:var(--red-600);">0 rows</span></p>
                <div style="overflow-x:auto;">
                  <table class="data-table" id="resultsTable">
                    <thead><tr id="tableHead"></tr></thead>
                    <tbody id="tableBody"></tbody>
                  </table>
                </div>
                <div class="response-box show" id="queryLog"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-icon card-icon-blue">👥</div>
              <h2>Quick Select Patient</h2>
            </div>
            <div class="card-body">
              <p style="font-size:12px;color:var(--gray-500);margin-bottom:12px;">Click a patient to load their record:</p>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('1')">Patient 1 — Maria Santos (Cardiology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('2')">Patient 2 — Juan Dela Cruz (Endocrinology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('3')">Patient 3 — Ana Reyes (Pulmonology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('4')">Patient 4 — Pedro Bautista (Rheumatology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('5')">Patient 5 — Rosario Garcia (Cardiology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('6')">Patient 6 — Jose Ramirez (Cardiology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('7')">Patient 7 — Liza Mendoza (Cardiology)</button>
                <button class="btn btn-outline btn-sm" style="justify-content:flex-start;" onclick="setPayload('15')">Patient 15 — Teresa Flores (Pulmonology)</button>
              </div>

              <div class="divider" style="margin:16px 0;"></div>
              <p style="font-size:12px;color:var(--gray-500);" id="dataSourceNote">
                Records are retrieved from the hospital patient database.
              </p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase.js"></script>
  <script>
    document.getElementById('sidebarMount').outerHTML = renderSidebar('sql-injection.html');
    document.getElementById('topnavMount').outerHTML = renderTopnav('Patient Records', 'Search and manage patient information');

    const DB = {
      patients: [
        { id: 1, name: 'Maria Santos', diagnosis: 'Hypertension', ssn: '123-45-6789', notes: 'Monthly checkups. Medication: Amlodipine 5mg' },
        { id: 2, name: 'Juan Dela Cruz', diagnosis: 'Diabetes Type 2', ssn: '987-65-4321', notes: 'Insulin dependent. Monitor glucose daily.' },
        { id: 3, name: 'Ana Reyes', diagnosis: 'Asthma', ssn: '456-78-9012', notes: 'Carry salbutamol inhaler. Avoid dust.' },
        { id: 4, name: 'Pedro Bautista', diagnosis: 'Arthritis (Rheumatoid)', ssn: '321-54-9870', notes: 'Physical therapy twice weekly.' },
        { id: 5, name: 'Rosario Garcia', diagnosis: 'Coronary Artery Disease', ssn: '654-32-1098', notes: 'Restrict strenuous activity. Aspirin daily.' },
      ],
      users: [
        { id: 1, username: 'admin', password: 'admin123', role: 'Administrator', email: 'admin@medicare.ph' },
        { id: 2, username: 'doctor', password: 'password1', role: 'Physician', email: 'dr.santos@medicare.ph' },
        { id: 3, username: 'nurse', password: 'nurse123', role: 'Nurse', email: 'nurse.reyes@medicare.ph' },
        { id: 4, username: 'radiologist', password: 'xray2024', role: 'Radiologist', email: 'rad@medicare.ph' },
      ]
    };

    // When Firebase is configured, replace the simulated patient data with the
    // real Firestore records — the SQLi simulation then operates on live data.
    let dbFromFirestore = false;

    (async function loadFirestorePatients() {
      try {
        const patients = await window.mproDb.getPatients();
        if (!patients || !patients.length) return;
        DB.patients = patients.map(p => ({
          id: p.id,
          patientId: p.patientId,
          name: p.name,
          diagnosis: p.diagnosis,
          department: p.department,
          room: p.room,
          status: p.status,
          ssn: p.ssn,
          notes: p.notes,
          dob: p.dob,
          gender: p.gender,
          bloodType: p.bloodType,
          physician: p.physician,
          ward: p.ward,
          medications: p.medications,
          allergies: p.allergies,
          admitDate: p.admitDate,
          phone: p.phone,
        }));
        dbFromFirestore = true;
        document.getElementById('dataSourceNote').textContent =
          `Records are retrieved from the hospital patient database — ${DB.patients.length} patients on file.`;
      } catch (e) {
        // Firebase not configured — keep the simulated demo data.
      }
    })();

    function setPayload(p) {
      document.getElementById('sqlInput').value = p;
    }

    function simulateSQLi(input) {
      const lower = input.toLowerCase();
      let results = [], tableName = 'patients', log = '';

      log += `> Executing: SELECT * FROM patients WHERE id = '${input}'\n`;

      if (lower.includes('union') && lower.includes('users')) {
        results = DB.users;
      } else if (lower.includes("' or '1'='1") || (lower.includes(' or ') && lower.includes('1=1')) || lower.includes("or '1'")) {
        results = DB.patients;
      } else if (lower.includes("'--") || lower.includes("' --") || lower.includes("'#")) {
        const id = parseInt(input);
        const p = DB.patients.find(p => p.id === id);
        results = p ? [p] : DB.patients.slice(0, 1);
      } else if (lower.includes('drop table')) {
        results = [];
        log += '> Statement rejected by the database server.\n';
      } else if (lower.includes('and 1=2')) {
        results = [];
      } else {
        const id = parseInt(input);
        if (!isNaN(id)) {
          const p = DB.patients.find(p => p.id === id);
          results = p ? [p] : [];
        }
      }

      log += `> Rows returned: ${results.length}`;
      return { results, tableName, log };
    }

    async function doQuery() {
      const input = document.getElementById('sqlInput').value;

      // With Firestore data loaded, run the simulation client-side on live
      // records. Otherwise prefer the server API, then fall back to simulation.
      if (dbFromFirestore) {
        const { results, tableName, log } = simulateSQLi(input);
        renderResults(results, `SELECT * FROM patients WHERE id = '${input}'`, tableName, log);
        return;
      }

      try {
        const res = await fetch(`/api/sql?id=${encodeURIComponent(input)}`);
        const data = await res.json();
        renderResults(data.results, data.query, data.tableName || 'patients');
      } catch(e) {
        const { results, tableName, log } = simulateSQLi(input);
        renderResults(results, `SELECT * FROM patients WHERE id = '${input}'`, tableName, log);
      }
    }

    // Holds the records of the last rendered result set, so the View button can
    // open a full patient-detail modal without embedding data in markup.
    let lastResultRows = [];

    function viewPatientRow(idx) {
      const rec = lastResultRows[idx];
      if (!rec) return;
      // Users-table rows (UNION result) have no patient fields — show a generic view.
      if (!rec.name) {
        openModal({
          title: '🗄️ Record',
          subtitle: escapeHtml(String(rec.username || rec.id || '')),
          body: Object.keys(rec).map(k =>
            kv(k.replace(/_/g, ' '), `<span style="font-family:monospace;">${escapeHtml(rec[k])}</span>`)
          ).join(''),
          footer: '<button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>',
        });
        return;
      }
      openPatientModal(rec);
    }

    function renderResults(results, query, tableName, log) {
      const wrap = document.getElementById('sqlResult');
      wrap.style.display = 'block';
      document.getElementById('resultCount').textContent = `${results.length} row(s) found`;

      const logEl = document.getElementById('queryLog');
      logEl.textContent = log || `> Query: ${query}\n> Rows: ${results.length}`;

      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');

      if (!results.length) {
        head.innerHTML = '';
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-500);padding:20px;">No records found</td></tr>';
        return;
      }

      lastResultRows = results;
      const cols = Object.keys(results[0]);
      const isPatientSet = results.every(r => 'name' in r);
      head.innerHTML = cols.map(c => `<th>${c}</th>`).join('') + (isPatientSet ? '<th>Action</th>' : '');

      body.innerHTML = results.map((r, i) =>
        `<tr>${cols.map(c => `<td style="font-size:12px;">${r[c] ?? ''}</td>`).join('')}` +
        (isPatientSet
          ? `<td style="font-size:12px;"><button class="btn-link" onclick="viewPatientRow(${i})">View details →</button></td>`
          : '') +
        '</tr>'
      ).join('');
    }
  </script>
</body>
</html>
